# separate terms of service, privacy policy, and support
# documentation.

name: Symfony

on:
    push:
        branches: [ "develop", "main" ]
    pull_request:
        branches: [ "develop","main" ]

permissions:
    contents: read

jobs:
    symfony-tests:
        runs-on: ubuntu-latest
        env:
            DATABASE_URL: postgresql://root:password@127.0.0.1:5432/ohoui_test?serverVersion=16&charset=utf8
            MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
            SOLR_HOST: 127.0.0.1
            SOLR_PORT: 8983
            SOLR_CORE: owi_french
            SOLR_PATH: /
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: ohoui_test
                    POSTGRES_PASSWORD: password
                    POSTGRES_USER: root
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            solr:
                image: solr:9
                ports:
                    - 8983:8983
                options: >-
                    --health-cmd "curl -s http://localhost:8983/solr/admin/info/system"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: mbstring, xml, ctype, iconv, pgsql
            - uses: actions/checkout@v4
            - name: Install Dependencies
              run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
            - name: Format Check
              run: vendor/bin/mago format --check
            - name: Lint Check
              run: vendor/bin/mago lint
            - name: Static Analysis
              run: vendor/bin/mago analyze
            - name: Architecture Guard
              run: vendor/bin/mago guard
            - name: Install Importmap
              run: php bin/console importmap:install
            - name: Create Solr Core
              run: |
                  SOLR_CONTAINER=$(docker ps --filter "ancestor=solr:9" --format "{{.ID}}")
                  docker exec -u solr $SOLR_CONTAINER solr create -c owi_french
                  # Désactiver le mode schéma dynamique (Data-driven)
                  curl -X POST -H 'Content-type:application/json' --data-binary '{"set-user-property": {"update.autoCreateFields":"false"}}' http://localhost:8983/solr/owi_french/config
                  # Définition explicite du schéma
                  curl -X POST -H 'Content-type:application/json' --data-binary '{
                    "add-field": [
                      {"name":"language", "type":"string", "indexed":true, "stored":true, "docValues":true},
                      {"name":"domain", "type":"string", "indexed":true, "stored":true, "docValues":true},
                      {"name":"title", "type":"text_general", "indexed":true, "stored":true},
                      {"name":"content", "type":"text_general", "indexed":true, "stored":true},
                      {"name":"url", "type":"string", "indexed":true, "stored":true}
                    ]
                  }' http://localhost:8983/solr/owi_french/schema
            - name: Create Database and Schema
              run: |
                  php bin/console doctrine:database:create --env=test --if-not-exists
                  php bin/console doctrine:schema:create --env=test
                  php bin/console app:index-sample
            - name: Execute tests
              run: vendor/bin/phpunit --display-notices
