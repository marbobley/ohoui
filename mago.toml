php-version = "8.4"

[source]
paths = [
  "src",
  "importmap.php",
  "migrations/",
]
includes = ["vendor"]
excludes = ["src/Kernel.php", "src/DataFixtures"]

[formatter]
print-width = 120
tab-width = 4
use-tabs = false

[linter]
integrations = ["phpunit", "symfony"]

[linter.rules]
ambiguous-function-call = { enabled = true }
literal-named-argument = { enabled = true }
halstead = { effort-threshold = 7000 }
too-many-methods = { enabled = true, threshold = 25 }
excessive-parameter-list = { enabled = true, threshold = 10 }
no-boolean-flag-parameter = { enabled = true }
no-else-clause = { enabled = true }

[analyzer]
find-unused-definitions = true
find-unused-expressions = true
analyze-dead-code = true
check-throws = true
allow-possibly-undefined-array-keys = true
perform-heuristic-checks = true

[guard]
[guard.perimeter]
layers = { domain = ["App\\Domain\\"], application = ["App\\Application\\"], infrastructure = ["App\\Infrastructure\\", "App\\Service\\", "App\\Command\\"], ui = ["App\\Controller\\", "App\\UserInterface\\"] }

[[guard.perimeter.rules]]
namespace = "App\\"
permit = ["App\\", "Symfony\\", "Psr\\", "Doctrine\\", "Solarium\\", "Override", "LogicException", "RuntimeException", "Exception", "sprintf", "str_contains", "is_array", "reset", "count"]

[[guard.perimeter.rules]]
namespace = "App\\Domain\\"
permit = ["App\\Domain\\", "Symfony\\", "Psr\\", "Override", "LogicException", "RuntimeException", "Exception"]

[[guard.perimeter.rules]]
namespace = "App\\Application\\"
permit = ["App\\Domain\\", "App\\Application\\", "Symfony\\", "Psr\\", "Override"]

[[guard.perimeter.rules]]
namespace = "App\\Infrastructure\\"
permit = ["App\\Domain\\", "App\\Application\\", "App\\Infrastructure\\", "App\\Service\\", "Symfony\\", "Psr\\", "Solarium\\", "Override", "is_array", "reset"]

[[guard.perimeter.rules]]
namespace = "App\\Service\\"
permit = ["App\\Domain\\", "App\\Application\\", "App\\Service\\", "Symfony\\", "Psr\\", "Solarium\\", "Override", "str_contains", "sprintf"]

[[guard.perimeter.rules]]
namespace = "App\\Command\\"
permit = ["App\\Domain\\", "App\\Application\\", "App\\Infrastructure\\", "App\\Service\\", "App\\Command\\", "Symfony\\", "Psr\\", "LogicException", "sprintf"]

[[guard.perimeter.rules]]
namespace = "App\\Controller\\"
permit = ["App\\Domain\\", "App\\Application\\", "App\\Controller\\", "Symfony\\", "Psr\\", "Override"]

[[guard.perimeter.rules]]
namespace = "App\\UserInterface\\"
permit = ["App\\Domain\\", "App\\Application\\", "App\\UserInterface\\", "Symfony\\", "Psr\\", "Override"]

[guard.structural]
[[guard.structural.rules]]
on = "App\\Domain\\Model\\**"
must-be-final = true

[[guard.structural.rules]]
on = "App\\Application\\Service\\**"
must-be-final = true
must-be-named = "*UseCase"
